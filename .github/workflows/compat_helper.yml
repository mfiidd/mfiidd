name: CompatHelper

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

# The job writes through the app token below, so the Actions token needs nothing.
permissions:
  contents: read

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.COMPATHELPER_APP_ID }}
          private-key: ${{ secrets.COMPATHELPER_APP_KEY }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        # CompatHelper skips a bump that already has an open pull request, by
        # matching the open pull requests' author against a username that
        # defaults to github-actions[bot] (src/utilities/ci.jl). The app opens
        # them now, so that default matches nothing, the list of titles to skip
        # comes back empty, and every weekly run opens a second pull request for
        # every bump still waiting. Naming the app restores the skip. The email
        # is left at its default, which this does not depend on.
        run: |
          julia -e '
              using CompatHelper
              CompatHelper.main(
                  ENV,
                  CompatHelper.GitHubActions(username = "mfiidd-compathelper[bot]"),
              )'
        env:
          # An app installation token, not secrets.GITHUB_TOKEN. GitHub triggers
          # no workflow for anything the Actions token authors, so pull requests
          # opened with it get no render and cannot satisfy the required checks.
          # This token is scoped to one app installation and expires in an hour.
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
