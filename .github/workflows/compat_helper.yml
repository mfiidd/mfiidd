name: CompatHelper

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        run: julia -e 'using CompatHelper; CompatHelper.main()'
        env:
          # A personal access token, not secrets.GITHUB_TOKEN. GitHub refuses to
          # trigger workflows for anything the Actions token authors, so a pull
          # request opened with it gets no render, cannot satisfy the required
          # checks, and never reaches the auto-merge workflow. The token needs
          # contents and pull-requests write on this repository.
          GITHUB_TOKEN: ${{ secrets.COMPATHELPER_TOKEN }}
