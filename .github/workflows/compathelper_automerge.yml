name: CompatHelper auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # The app's own login. CompatHelper authors through an app installation token
    # now, so this is no longer the Actions bot, but matching the type alone would
    # leave a branch name as the only thing identifying the pull request, and an
    # author chooses that.
    if: >-
      github.event.pull_request.user.login == 'mfiidd-compathelper[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'compathelper/new_version/')
    steps:
      # pull_request_target runs with write access, so check out the base ref and
      # never the pull request's own code. Only the package list is read here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/chain-affecting-packages.txt
          sparse-checkout-cone-mode: false
      # The required check is the full site render, which executes every session,
      # so a bump that breaks one cannot merge. It does not regenerate the chains
      # in data/, which the sessions load, so a bump to a package that can move
      # the draws is left for a person. chain-affecting-packages.txt holds that
      # list, shared with chains-current.yml so the two cannot drift apart.
      - name: Decide whether this bump may merge itself
        id: decide
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # CompatHelper writes two title forms, "bump compat for X to Y" and
          # "add new compat entry for X at version Y", and a title this cannot
          # read is left for a person rather than waved through.
          dep=$(printf '%s\n' "$TITLE" \
                | sed -n 's/.* for \([A-Za-z0-9_]*\) \(to\|at version\) .*/\1/p')
          echo "dependency: ${dep:-<unparsed>}"
          if [ -z "$dep" ]; then
            echo "No dependency readable from the title, so a person reviews this one."
            echo "auto=no" >> "$GITHUB_OUTPUT"
          elif [ ! -f .github/chain-affecting-packages.txt ]; then
            # grep exits 2 for a missing file and 1 for no match, which the elif
            # below cannot tell apart, so a moved or renamed list would wave
            # everything through. Checked separately for that reason.
            echo "The package list is missing, so a person reviews this one."
            echo "auto=no" >> "$GITHUB_OUTPUT"
          elif grep -qxF "$dep" .github/chain-affecting-packages.txt; then
            echo "$dep can move the committed chains, so a person reviews this one."
            echo "auto=no" >> "$GITHUB_OUTPUT"
          else
            echo "auto=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable auto-merge (squash)
        if: steps.decide.outputs.auto == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto --squash \
            --repo ${{ github.repository }}
