name: CompatHelper auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Everything below goes through the app token minted in the job, and nothing
# checks the repository out, so the Actions token needs no scopes at all.
permissions: {}

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # The app's own login. CompatHelper authors through an app installation token
    # now, so this is no longer the Actions bot, but matching the type alone would
    # leave a branch name as the only thing identifying the pull request, and an
    # author chooses that.
    if: >-
      github.event.pull_request.user.login == 'mfiidd-compathelper[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'compathelper/new_version/')
    steps:
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.COMPATHELPER_APP_ID }}
          private-key: ${{ secrets.COMPATHELPER_APP_KEY }}
      # What makes a bump safe to merge unreviewed is that it cannot change a
      # version anything runs. CompatHelper widens a [compat] bound and says so
      # in the title, which leaves the Manifest.toml pin admissible, so
      # Pkg.resolve keeps it and the render installs what it installed before.
      # The committed chains in data/ and the deck figures drawn from them are
      # untouched by that, whichever package it is. A bump is permission for a
      # later move rather than the move itself: the move lands when someone
      # re-resolves and Manifest.toml changes, which is the diff worth a
      # person's attention and what a staleness check has to compare.
      - name: Decide whether this bump may merge itself
        id: decide
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The list of paths, never the branch's content: pull_request_target
          # runs with write access, so nothing here checks out or executes code
          # from the pull request. A failure here aborts the step and leaves the
          # merge unenabled, which is the side to fail on.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | sort)
          echo "paths changed:"
          printf '%s\n' "${files:-<none>}"
          # Matched with case rather than grep: grep -q closing the pipe early
          # can leave the pipeline non-zero under pipefail even on a match.
          case "$TITLE" in
            *'(keep existing compat)'*) keeps_bound=yes ;;
            *) keeps_bound=no ;;
          esac
          if [ "$files" != "Project.toml" ]; then
            echo "This touches more than the compat bounds, so a person reviews it."
            echo "auto=no" >> "$GITHUB_OUTPUT"
          elif [ "$keeps_bound" != yes ]; then
            echo "The title does not say the existing bound is kept, so a person reviews it."
            echo "auto=no" >> "$GITHUB_OUTPUT"
          else
            echo "auto=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable auto-merge (squash)
        if: steps.decide.outputs.auto == 'yes'
        env:
          # The app token again, not secrets.GITHUB_TOKEN, and for the same
          # reason it is used to open these pull requests: GitHub raises no
          # workflow for anything the Actions token authors. Auto-merge is
          # performed as whoever enabled it, so enabling it with the Actions
          # token lands a squash commit on main that triggers no push event and
          # no deploy. #196 is the precedent: its squash commit 2f145d3 has zero
          # workflow runs, where every compat merge done by hand has a deploy run.
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto --squash \
            --repo ${{ github.repository }}
