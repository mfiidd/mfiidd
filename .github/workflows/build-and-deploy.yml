# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_dispatch:
    inputs:
      full_rerender:
        description: 'Ignore the execution cache and re-run every session'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 1 * *'  # Run at 00:00 on the 1st of every month
  push:
    branches: [main]
  pull_request:
  merge_group:

name: deploy

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy step pushes the rendered site to gh-pages, so the workflow token
    # needs write access. Declared here rather than relying on the org-wide
    # default, which is read-only for new organisations.
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
      JULIA_PROJECT: "@."
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'

      - name: Install Julia dependencies
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.resolve()'
          # Sessions that cannot share the main environment declare their own via
          # `exeflags` in the front matter. Instantiate each so the render can find
          # its packages. No resolve here: those manifests are pinned deliberately.
          for env in envs/*/; do
            if [ -f "$env/Project.toml" ]; then
              julia --project="$env" -e 'using Pkg; Pkg.instantiate()'
            fi
          done

      # `freeze: auto` in _quarto.yml re-executes a session only when its own
      # .qmd changes, so restoring _freeze/ from an earlier run means a slides
      # or prose edit no longer pays for every other session's Julia.
      #
      # Freeze watches the source document alone. It has no idea that a session
      # calls into src/, reads data/, or resolves against the Manifest, so a
      # change to any of those would be served stale from the cache. Those files
      # are hashed into the key instead: change one and no cache is restored,
      # which is the full re-render. Add to this list anything else a session
      # reads at execution time.
      - name: Restore execution cache
        if: inputs.full_rerender != true
        uses: actions/cache@v4
        with:
          path: _freeze
          key: >-
            freeze-${{ runner.os }}-${{ hashFiles(
              'src/**', 'Project.toml', 'Manifest.toml',
              'data/**', '_quarto.yml') }}-${{ github.sha }}
          restore-keys: >-
            freeze-${{ runner.os }}-${{ hashFiles(
              'src/**', 'Project.toml', 'Manifest.toml',
              'data/**', '_quarto.yml') }}-

      - name: Render site
        run: quarto render

      - name: Build API reference
        run: julia --project=docs docs/make.jl

      - name: Bundle API reference into site
        run: cp -r docs/build _site/api

      - name: Upload website (PR artifact)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: site
          retention-days: 5
          path: _site

      # A pull request from a fork runs with a read-only token, whatever this
      # workflow asks for, so pushing the preview to gh-pages returns 403 and
      # the job goes red on a build that succeeded. Skip the publish instead.
      # The artifact above is uploaded either way, so an outside contribution
      # can still be reviewed by downloading the built site.
      - name: Deploy PR preview 🚀
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: _site
          target-folder: previews/PR-${{ github.event.pull_request.number }}
          clean: false

      # A preview nobody can find is no preview. Post its address as a comment
      # and edit that same comment on later pushes, so the thread does not
      # collect one link per commit.
      - name: Comment with the preview link
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- preview-link -->';
            const {owner, repo} = context.repo;
            const number = context.issue.number;
            const url =
              `https://${owner}.github.io/${repo}/previews/PR-${number}/`;
            const body = [
              marker,
              `📖 Preview of this pull request: ${url}`,
              '',
              'Rebuilt on every push to the branch.',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number: number},
            );
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: existing.id, body},
              );
            } else {
              await github.rest.issues.createComment(
                {owner, repo, issue_number: number, body},
              );
            }

      - name: Deploy to GitHub pages 🚀
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: _site
          single-commit: true
          clean: true
          clean-exclude: |
            previews
